<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pocket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo-600 -->
      <stop offset="50%" stop-color="#7C3AED" /> <!-- Violet-600 -->
      <stop offset="100%" stop-color="#C084FC" /> <!-- Purple-400 -->
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F5F2EB" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
  </defs>
  
  <!-- Outer smooth rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Stylized Pocket Container -->
  <g filter="url(#shadow)">
    <!-- Main Pocket Shape -->
    <path d="M156 150 C156 150, 356 150, 356 150 C356 250, 356 360, 256 410 C156 360, 156 250, 156 150 Z" fill="url(#pocket-grad)" />
    
    <!-- Pocket flap / overlap for pocket appearance -->
    <path d="M156 150 L356 150 L256 210 Z" fill="#FFFFFF" opacity="0.15" />
    
    <!-- Clean, rounded card poking out of the pocket -->
    <rect x="206" y="100" width="100" height="120" rx="12" fill="#FFFFFF" opacity="0.95" />
    <!-- Mini horizontal aesthetic lines on the pocket card -->
    <line x1="226" y1="130" x2="286" y2="130" stroke="#7C3AED" stroke-width="6" stroke-linecap="round" />
    <line x1="226" y1="150" x2="270" y2="150" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <line x1="226" y1="170" x2="280" y2="170" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    
    <!-- Main stylized 'P' icon on pocket front -->
    <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="105" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">P</text>
  </g>
</svg>
